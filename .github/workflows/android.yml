name: Build Android APK

on:
  push:
    branches: [ "main", "pwstudy-v1", "pwstudy-telegram-fix", "pwstudy-player-pdf-fix", "pwstudy-pdf-settings-2026-11-16", "pwstudy-pdf-toolbar-custom-2026-11-16", "pwstudy-advanced-pdf-tools-2026-11-16", "pwstudy-pdfs-home-customize-2026-11-17", "pwstudy-admob-test-2026-11-18", "pwstudy-telegram-landscape-2026-11-18", "pwstudy-adfree-2026-11-18", "pwstudy-restore-*", "pwstudy-v3-safe-*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prevent ad SDK regressions
        run: |
          if grep -R -n -E 'com\.google\.android\.gms\.ads|play-services-ads|user-messaging-platform|StudyAdManager|StudyAdClock' app/src/main app/build.gradle; then
            echo 'Ad code or SDK detected in the ad-free build'
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PWStudy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build side-by-side preview APK
        run: gradle -PpwstudyPreview assembleDebug

      - name: Upload side-by-side preview APK
        uses: actions/upload-artifact@v4
        with:
          name: PWStudy-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
