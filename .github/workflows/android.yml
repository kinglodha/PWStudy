name: Build Android APK

on:
  push:
    branches: [ "main", "pwstudy-v1", "pwstudy-telegram-fix", "pwstudy-player-pdf-fix", "pwstudy-pdf-settings-2026-11-16", "pwstudy-pdf-toolbar-custom-2026-11-16", "pwstudy-advanced-pdf-tools-2026-11-16", "pwstudy-pdfs-home-customize-2026-11-17", "pwstudy-admob-test-2026-11-18", "pwstudy-telegram-landscape-2026-11-18", "pwstudy-adfree-2026-11-18", "pwstudy-restore-*", "pwstudy-v3-safe-*", "pwstudy-v3-lecture-resume-*", "pwstudy-v3-icon-option3-*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject legacy launcher and missing advanced activities
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          launchers = []
          for node in app:
              if node.tag not in ('activity', 'activity-alias'):
                  continue
              for intent in node.findall('intent-filter'):
                  actions = {x.get(ns+'name') for x in intent.findall('action')}
                  categories = {x.get(ns+'name') for x in intent.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                      if node.get(ns+'enabled', 'true') != 'false':
                          launchers.append(node.get(ns+'targetActivity') if node.tag == 'activity-alias' else node.get(ns+'name'))
          assert launchers == ['.MainActivity'], f'Unexpected launcher(s): {launchers}'
          required = {'MainActivity','SettingsActivity','HomeCustomizationActivity','PdfToolbarEditorActivity','PdfStudyToolsActivity','DeviceDocumentsActivity','TelegramViewerActivity','FocusTimerActivity','StudyPlannerActivity','FlashcardsActivity','PdfOrganizerActivity','PdfManagerActivity','ExternalPdfActivity','PdfActivity','PlayerActivity','LibraryActivity'}
          names = {n.get(ns+'name','').split('.')[-1] for n in app.findall('activity')}
          assert required <= names, f'Missing activities: {required - names}'
          print('Advanced launcher and activity declarations preserved')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prevent ad SDK regressions
        run: |
          if grep -R -n -E 'com\.google\.android\.gms\.ads|play-services-ads|user-messaging-platform|StudyAdManager|StudyAdClock' app/src/main app/build.gradle; then
            echo 'Ad code or SDK detected in the ad-free build'
            exit 1
          fi

      - name: Run standalone PDF naming regression tests
        run: |
          mkdir -p build/pdf-regression
          javac -encoding UTF-8 -d build/pdf-regression \
            app/src/main/java/com/study/pwjarvis/PdfNameRules.java \
            app/src/test/java/com/study/pwjarvis/PdfNameRulesRegression.java
          java -cp build/pdf-regression com.study.pwjarvis.PdfNameRulesRegression

      - name: Guard advanced navigation and offline feature entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("app/src/main/java/com/study/pwjarvis")
          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          activities = {
              node.get(ns + "name", "").split(".")[-1]
              for node in manifest.find("application").findall("activity")
          }
          home = (root / "MainActivity.java").read_text(encoding="utf-8")
          checks = {
              "PDF manager": ("PdfManagerActivity", "open(PdfManagerActivity.class)"),
              "Telegram channels": ("TelegramViewerActivity", "open(TelegramViewerActivity.class)"),
              "offline library": ("LibraryActivity", "open(LibraryActivity.class)"),
              "settings": ("SettingsActivity", "open(SettingsActivity.class)"),
              "PDF picker": ("PdfActivity", "choosePdf(PICK_READER_PDF)"),
              "video picker": ("PlayerActivity", "this::chooseVideo"),
          }
          for name, (activity, entry) in checks.items():
              assert activity in activities, f"{name}: activity missing from manifest"
              assert (root / (activity + ".java")).is_file(), f"{name}: source missing"
              assert entry in home, f"{name}: home navigation entry missing"
              print("Preserved navigation:", name)

          reader = (root / "PdfActivity.java").read_text(encoding="utf-8")
          player = (root / "PlayerActivity.java").read_text(encoding="utf-8")
          telegram = (root / "TelegramViewerActivity.java").read_text(encoding="utf-8")
          for symbol in ("ScaleGestureDetector", "updateImageMatrix", "PdfRenderer"):
              assert symbol in reader, f"PDF reader regression: {symbol}"
          for symbol in ("onConfigurationChanged", "ExoPlayer", "enterFullscreen"):
              assert symbol in player, f"Video player regression: {symbol}"
          assert "TelegramViewerActivity" in home and len(telegram) > 1000
          assert "OfflineVideoLibrary" in player
          assert "PdfOrganizerActivity" in activities
          assert "FlashcardsActivity" in activities
          assert "FocusTimerActivity" in activities
          print("Source-level PDF/video/Telegram/offline navigation checks passed")
          PY

      - name: Build debug APK
        run: |
          for attempt in 1 2 3 4; do
            if gradle assembleDebug --stacktrace; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "::warning::Build attempt $attempt failed; retrying without changing dependencies"
            sleep $((attempt * 30))
          done

      - name: Verify advanced feature sources and report APK size
        run: |
          test -f app/src/main/java/com/study/pwjarvis/MainActivity.java
          test -f app/src/main/java/com/study/pwjarvis/PdfManagerActivity.java
          test -f app/src/main/java/com/study/pwjarvis/TelegramViewerActivity.java
          test -f app/src/main/java/com/study/pwjarvis/PdfReadingProgress.java
          test -f app/src/main/java/com/study/pwjarvis/PdfOrganizerActivity.java
          test -f app/src/main/java/com/study/pwjarvis/FlashcardsActivity.java
          test -f app/src/main/java/com/study/pwjarvis/StudyPlannerActivity.java
          test -f app/src/main/java/com/study/pwjarvis/FocusTimerActivity.java
          grep -q 'case "offline_ocr"' app/src/main/java/com/study/pwjarvis/PdfActivity.java
          apk=app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s "$apk")
          echo "Actual debug APK: $bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -lt 100000000 ]; then
            echo "::warning::APK remains below 100 MB target; add only functional features"
          fi
      - name: Verify standard APK launcher
        run: |
          aapt=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$aapt"
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build/launcher-badging.txt
          grep -F "launchable-activity: name='com.study.pwjarvis.MainActivity'" build/launcher-badging.txt
          grep -Fx "application-label:'Tweak'" build/launcher-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PWStudy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build side-by-side preview APK
        run: |
          for attempt in 1 2 3 4; do
            if gradle -PpwstudyPreview assembleDebug --stacktrace; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "::warning::Build attempt $attempt failed; retrying without changing dependencies"
            sleep $((attempt * 30))
          done

      - name: Verify preview APK launcher
        run: |
          aapt=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$aapt"
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build/launcher-badging.txt
          grep -F "launchable-activity: name='com.study.pwjarvis.MainActivity'" build/launcher-badging.txt
          grep -Fx "application-label:'Tweak'" build/launcher-badging.txt

      - name: Upload side-by-side preview APK
        uses: actions/upload-artifact@v4
        with:
          name: PWStudy-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
