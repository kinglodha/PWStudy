name: Build Android APK
on:
  push:
    branches: [ "main", "pwstudy-**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Report actual APK size
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s "$apk")
          echo "APK size: $bytes bytes"
          echo "APK size: $(awk "BEGIN {printf \"%.2f\", $bytes/1000000}") MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -lt 50000000 ]; then
            echo "::warning::APK is below the 50 MB target"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PWStudy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
