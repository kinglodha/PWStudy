plugins {
    id 'com.android.application'
}

android {
    namespace 'com.study.pwjarvis'
    compileSdk 35

    defaultConfig {
        applicationId = project.hasProperty('pwstudyPreview') ? 'com.study.pwjarvis.preview' : 'com.study.pwjarvis'
        manifestPlaceholders = [appLabel: project.hasProperty('pwstudyPreview') ? 'PWStudy Preview' : 'PW Jarvis Study']
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.6'
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // SDK 25.4 retains PWStudy's minSdk 23 (25.5+ needs 24).
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
