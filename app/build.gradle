plugins {
    id 'com.android.application'
}

android {
    namespace 'com.study.pwjarvis'
    compileSdk 35

    defaultConfig {
        applicationId = project.hasProperty('pwstudyPreview') ? 'com.study.pwjarvis.preview' : 'com.study.pwjarvis'
        manifestPlaceholders = [appLabel: 'Tweak']
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '0.8-offline-ocr-preview'
    }
}

dependencies {
    // Bundled on-device recognition models.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    // Used by the reader's adaptive-threshold scanned-page enhancement.
    implementation 'org.opencv:opencv:4.12.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
